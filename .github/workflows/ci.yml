name: WEA EVO - CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancela ejecuciones anteriores si subes un nuevo commit rápido al mismo PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Análisis estático ultra-rápido (Sintaxis, PEP8, Imports)
  lint:
    name: Linter & Format Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check src/"

  # JOB 2: Pruebas unitarias multiplataforma (Linux y macOS)
  test:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint  # Solo corre los tests si el código pasó el linter primero
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    env:
      # CRÍTICO: Permite correr tests de PyQt6 sin pantalla física
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux system dependencies for PyQt6
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libopengl0 libsndfile1 ffmpeg vorbis-tools flac

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-qt numpy scipy PyQt6 pyqtgraph soundfile
          pip install -e .

      - name: Run Pytest
        run: |
          pytest
